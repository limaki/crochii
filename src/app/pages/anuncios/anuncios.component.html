<!-- ✅ Si hay perfiles -->
<div *ngIf="perfiles.length > 0" class="space-y-8">
  <!-- 🔢 Paginador (TOP, centrado) -->
  <div class="mt-8 flex justify-center">
    <div class="inline-flex items-center gap-2 bg-white/70 backdrop-blur rounded-full px-2 py-1 shadow">
      <button (click)="prevPage()" [disabled]="currentPage === 1"
        class="px-3 py-2 rounded-full border border-zinc-300 text-zinc-700 disabled:opacity-40 hover:bg-zinc-100 transition">
        <i class="pi pi-angle-left"></i>
      </button>

      <ng-container *ngFor="let p of visiblePages">
        <button *ngIf="p !== '…'" (click)="goToPage($any(p))"
          class="min-w-9 h-9 px-3 rounded-full text-sm border transition"
          [ngClass]="{
            'border-transparent bg-violet-600 text-white font-semibold shadow': p === currentPage,
            'border-zinc-300 text-zinc-700 hover:bg-zinc-100': p !== currentPage
          }">
          {{ p }}
        </button>
        <span *ngIf="p === '…'" class="px-2 text-zinc-400 select-none">…</span>
      </ng-container>

      <button (click)="nextPage()" [disabled]="currentPage === totalPages"
        class="px-3 py-2 rounded-full border border-zinc-300 text-zinc-700 disabled:opacity-40 hover:bg-zinc-100 transition">
        <i class="pi pi-angle-right"></i>
      </button>
    </div>
  </div>

  <!-- 🧩 GRID paginada (más aire vertical) -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-16 pt-2 pb-6">
    <div
      *ngFor="let perfil of paginatedPerfiles; trackBy: trackById"
      class="rounded-2xl shadow-xl h-full flex flex-col transform transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 hover:scale-[1.01]"
      [ngClass]="{
        'border-[4px] border-blue-600': perfil.verificado,
        'border-[3px] border-gray-300': !perfil.verificado
      }">

      <!-- Imagen (más alta) -->
      <div class="relative">
        <img [src]="apiUrl + perfil.foto" alt="{{ perfil.alias }}"
             class="w-full h-72 object-cover rounded-t-2xl" />
        <span *ngIf="perfil.verificado"
          class="absolute top-3 right-3 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md flex items-center gap-1">
          <i class="pi pi-check-circle text-sm"></i> Verificado
        </span>
      </div>

      <!-- Detalles (más padding y separación) -->
      <div class="p-6 text-zinc-800 flex-1 flex flex-col">
        <h3 class="text-xl font-bold mb-2 tracking-tight">{{ perfil.alias }}</h3>
        <p class="text-sm text-gray-500 mb-2">{{ perfil.zona }} · {{ perfil.genero }}</p>
        <p class="text-sm text-zinc-600 italic mb-6">{{ perfil.descripcion }}</p>

        <a [routerLink]="['/anuncio-individual', perfil._id]"
           class="mt-auto flex justify-center items-center gap-2 w-full bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white font-semibold py-3 rounded-xl shadow-md hover:brightness-110 active:scale-95 transition-all duration-300">
          Ver más
        </a>
      </div>
    </div>
  </div>

  <!-- 🔢 Paginador (BOTTOM, centrado con más margen) -->
  <div class="mb-6 flex justify-center">
    <div class="inline-flex items-center gap-2 bg-white/70 backdrop-blur rounded-full px-2 py-1 shadow">
      <button (click)="prevPage()" [disabled]="currentPage === 1"
        class="px-3 py-2 rounded-full border border-zinc-300 text-zinc-700 disabled:opacity-40 hover:bg-zinc-100 transition">
        <i class="pi pi-angle-left"></i>
      </button>

      <ng-container *ngFor="let p of visiblePages">
        <button *ngIf="p !== '…'" (click)="goToPage($any(p))"
          class="min-w-9 h-9 px-3 rounded-full text-sm border transition"
          [ngClass]="{
            'border-transparent bg-violet-600 text-white font-semibold shadow': p === currentPage,
            'border-zinc-300 text-zinc-700 hover:bg-zinc-100': p !== currentPage
          }">
          {{ p }}
        </button>
        <span *ngIf="p === '…'" class="px-2 text-zinc-400 select-none">…</span>
      </ng-container>

      <button (click)="nextPage()" [disabled]="currentPage === totalPages"
        class="px-3 py-2 rounded-full border border-zinc-300 text-zinc-700 disabled:opacity-40 hover:bg-zinc-100 transition">
        <i class="pi pi-angle-right"></i>
      </button>
    </div>
  </div>
</div>

<!-- 🚫 Si no hay perfiles -->
<p *ngIf="perfiles.length === 0"
   class="text-lg text-zinc-600 italic text-center max-w-2xl mx-auto mb-10">
  No hay anuncios que coincidan con tu búsqueda... <br />
  <span class="text-violet-600 font-semibold">Probá ajustando los filtros</span> o explorá otras zonas y preferencias 😉
</p>
