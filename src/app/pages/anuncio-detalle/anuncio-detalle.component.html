<div *ngIf="anuncio" class="max-w-4xl mx-auto mt-8 bg-white shadow-2xl rounded-3xl overflow-hidden border border-zinc-200">
  <!-- Header -->
  <div class="flex flex-col md:flex-row items-center gap-6 p-6 bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white">
    <img [src]="apiUrl + anuncio.foto"
         alt="Foto del anuncio"
         class="w-48 h-48 object-cover rounded-2xl border-4 border-white shadow-lg" />
    <div class="text-center md:text-left">
      <h2 class="text-4xl font-extrabold tracking-tight capitalize">{{ anuncio.alias }}</h2>
      <p class="text-lg font-light mt-1">{{ anuncio.edad }} años</p>
    </div>
  </div>

  <!-- Info -->
  <div class="p-6 text-zinc-800 space-y-6">   
     <div>
      <h3 class="text-xl font-semibold text-zinc-700 ">📝 Descripción</h3>
      <p class="text-zinc-600 bg-zinc-100 p-4 rounded-xl whitespace-pre-wrap leading-relaxed shadow-inner">
        {{ anuncio.descripcion }}
      </p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-base leading-relaxed">
      <!-- <div class="flex items-center gap-3">
        <span class="text-pink-500 text-xl">📍</span>
        <span><strong>Provincia:</strong> {{ anuncio.provincia }}</span>
      </div> -->
      <div class="flex justify-center">
        <a
          [href]="'https://wa.me/' + telefonoLimpio"
          target="_blank"
          class="flex items-center gap-3 px-6 py-4 rounded-full text-white font-semibold text-lg shadow-xl transition-all duration-200 hover:scale-105"
          style="background: linear-gradient(to right, #25D366, #128C7E)"
        >
          <img
            src="https://icongr.am/fontawesome/whatsapp.svg?size=24&color=ffffff"
            alt="WhatsApp"
            class="w-6 h-6"
          />
          Chatear por WhatsApp
        </a>
      </div>
      
      
      <div class="flex items-center gap-3">
        <span class="text-blue-500 text-xl">🗺️</span>
        <span><strong>Zona:</strong> {{ anuncio.zona }}</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-purple-500 text-xl">⚧️</span>
        <span><strong>Género:</strong> {{ anuncio.genero }}</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-green-500 text-xl">🌎</span>
        <span><strong>Nacionalidad:</strong> {{ anuncio.etnia }}</span>
      </div>
    </div>

    <!-- A quién atiende -->
    <div *ngIf="anuncio.atencion?.length" class="bg-zinc-50 p-4 rounded-xl border border-zinc-200">
      <h3 class="text-xl font-semibold text-zinc-700 mb-2">🙋 ¿A quién atiende?</h3>
      <div class="flex flex-wrap gap-3">
        <span *ngFor="let item of anuncio.atencion"
              class="bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white px-4 py-1 rounded-full text-sm font-medium shadow">
          {{ item }}
        </span>
      </div>
    </div>

    <!-- Descripción -->

  </div>
</div>
