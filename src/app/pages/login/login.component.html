<div class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
      <h2 class="text-3xl font-extrabold text-zinc-800 mb-6 text-center">Iniciar Sesión</h2>
  
      <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-zinc-700 mb-1">Email</label>
          <input type="email" name="email" [(ngModel)]="loginData.email" required
                 class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
        </div>
  
        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-zinc-700 mb-1">Contraseña</label>
          <input type="password" name="password" [(ngModel)]="loginData.password" required
                 class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
        </div>
  
        <!-- Botón Iniciar Sesión -->
        <button type="submit"
                class="w-full mt-4 bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white font-bold py-3 rounded-xl shadow-md hover:brightness-110 active:scale-95 transition-all duration-300">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>
