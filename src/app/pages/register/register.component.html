<div class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <h2 class="text-3xl font-extrabold text-zinc-800 mb-6 text-center">Crear Cuenta</h2>

    <form (ngSubmit)="register()" #registerForm="ngForm" class="space-y-5">
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-semibold text-zinc-700 mb-1">Nombre</label>
        <input type="text" name="nombre" [(ngModel)]="registerData.nombre" required
               class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <!-- Apellido -->
      <div>
        <label class="block text-sm font-semibold text-zinc-700 mb-1">Apellido</label>
        <input type="text" name="apellido" [(ngModel)]="registerData.apellido" required
               class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <!-- Número de Teléfono -->
      <div>
        <label class="block text-sm font-semibold text-zinc-700 mb-1">Número de Teléfono</label>
        <input type="text" name="telefono" [(ngModel)]="registerData.telefono" required
               placeholder="Ej: 5491122334455"
               class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-semibold text-zinc-700 mb-1">Email</label>
        <input type="email" name="email" [(ngModel)]="registerData.email" required
               class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-zinc-700 mb-1">Contraseña</label>
        <input type="password" name="password" [(ngModel)]="registerData.password" required
               class="w-full border border-zinc-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <!-- Botón Registrarse -->
      <button type="submit"
              class="w-full mt-4 bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white font-bold py-3 rounded-xl shadow-md hover:brightness-110 active:scale-95 transition-all duration-300">
        Crear Cuenta
      </button>
    </form>

    <!-- 🔗 Link para iniciar sesión -->
    <p class="text-sm text-center text-zinc-600 mt-6">
      ¿Ya tenés cuenta?
      <a routerLink="/login" class="text-violet-600 font-semibold hover:underline">Iniciá sesión</a>
    </p>
  </div>
</div>
